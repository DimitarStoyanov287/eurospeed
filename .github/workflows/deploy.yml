name: Deploy assessment
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: assessment-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CLOUDFLARE_D1_DATABASE_ID != '' && vars.CLOUDFLARE_WORKER_NAME != '' && vars.SITE_BASE_URL != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - run: node scripts/prepare-external-deploy.mjs
      - name: Apply database migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --config dist/server/wrangler.external.json
      - name: Deploy Worker with runtime secrets
        run: node scripts/external-deploy.mjs
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          MAIL_WEBHOOK_SECRET: ${{ secrets.MAIL_WEBHOOK_SECRET }}
